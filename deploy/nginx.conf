# One Baby Shop — nginx configuration (self-hosted)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/one-baby-shop.conf
#   sudo ln -s /etc/nginx/sites-available/one-baby-shop.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For a LAN/local server: SERVER_NAME=_ and PORT 80 (no TLS yet — set
# COOKIE_SECURE=false in backend/.env). For public production: put this
# server block behind TLS (certbot --nginx) and set COOKIE_SECURE=true.

server {
    listen 80;
    server_name _;

    # ── Frontend (built static assets) ────────────────────────────────────
    root /srv/one-baby-shop/web;
    index index.html;

    # SPA fallback: every unknown path serves the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy (same origin — no CORS needed in production) ────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhooks de Mercado Pago: sin rate limit del backend, pero con
        # cuerpo acotado y timeout razonable.
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }

    # Swagger /docs — solo desde la red local (comenta para exponerlo)
    location /docs {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:3001/docs;
    }
    location /docs/ {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://127.0.0.1:3001/docs/;
    }

    # Gzip para JSON/JS/CSS
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
