services:
  postgres:
    image: postgres:18-alpine
    container_name: one-baby-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-babyshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-babyshop_dev}
      POSTGRES_DB: ${POSTGRES_DB:-babyshop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-babyshop} -d ${POSTGRES_DB:-babyshop}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
